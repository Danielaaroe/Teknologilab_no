<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPIKE: Stripe + Hent sylinder - Teknologilab</title>
  <link rel="icon" href="https://www.teknologilab.no/static/favicon/favicon.ico" type="image/x-icon" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f8f9fa;
      --text: #333;
      --border: #2c3e50;
      --header-bg: #0e0e10;
      --code-bg: #f5f5f5;
    }
    [data-theme="dark"] {
      --bg: #1a1a1a;
      --bg-secondary: #2d2d2d;
      --text: #e0e0e0;
      --border: #4a90e2;
      --code-bg: #1e1e1e;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      background: var(--header-bg);
      color: white;
      text-align: center;
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .theme-toggle:hover { background: rgba(255, 255, 255, 0.2); }

    .image-container {
      width: 100%;
      height: 290px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    .image-container img {
      max-width: 600px;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
    }

    .section { margin: 2.5rem 0; }
    .section h2 { margin-bottom: 1rem; color: var(--border); }
    .section h3 { margin: 1.5rem 0 0.75rem 0; }
    .section p { margin-bottom: 1rem; }

    .info-box {
      background: var(--bg-secondary);
      padding: 1.5rem;
      border-radius: 8px;
      border-left: 4px solid var(--border);
      margin: 1rem 0;
    }

    .steps ol, .steps ul { margin: 1rem 0 0 1.5rem; }
    .steps li { margin: 0.5rem 0; }

    .code-block {
      background: var(--code-bg);
      padding: 1rem;
      border-radius: 4px;
      border-left: 3px solid var(--border);
      margin: 1rem 0;
      font-family: 'Courier New', monospace;
      overflow-x: auto;
      white-space: pre;
    }

    .warning {
      background: #fff3cd;
      color: #856404;
      padding: 1rem;
      border-radius: 4px;
      border-left: 4px solid #ffc107;
      margin: 1rem 0;
    }
    [data-theme="dark"] .warning {
      background: #3a3a2a;
      color: #e0d090;
      border-left-color: #b8860b;
    }

    .success {
      background: #d4edda;
      color: #155724;
      padding: 1rem;
      border-radius: 4px;
      border-left: 4px solid #28a745;
      margin: 1rem 0;
    }
    [data-theme="dark"] .success {
      background: #2a3a2a;
      color: #90e0a0;
      border-left-color: #28a745;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.75rem;
    }
    th, td {
      border: 1px solid rgba(0,0,0,0.15);
      padding: 0.75rem;
      text-align: left;
    }
    [data-theme="dark"] th, 
    [data-theme="dark"] td {
      border-color: rgba(255,255,255,0.2);
    }

    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 2rem;
      margin-top: 3rem;
    }

    @media (max-width: 768px) {
      .image-container { height: 180px; padding: 1rem; }
      .image-container img { max-width: 400px; }
      .container { padding: 1rem; }
      .theme-toggle { padding: 0.4rem 0.8rem; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
<li><a href="samling_5/samling_5.html">Samling 5: Lego Spike - gruppeoppgave og konkurranse</a></li>
</body>
</html>
